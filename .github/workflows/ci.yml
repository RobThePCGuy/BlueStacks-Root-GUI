name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Lint: flake8 "must-fix" set (real syntax errors, undefined names,
      # invalid literal comparisons) plus unused-import detection. Kept lean
      # so the gate is green and meaningful without forcing a full reformat.
      # pywin32 is Windows-only; ruff does not import the code, so this is
      # safe to run on the Linux runner.
      - name: Ruff lint
        run: ruff check --select E9,F63,F7,F82,F401 .

      # Compile check: catches syntax errors across every module. compileall
      # compiles without importing, so the Windows-only pywin32 import in
      # registry_handler.py does not break this on ubuntu.
      - name: Compile check
        run: python -m compileall -q .

  test:
    # The suite covers both platforms' code paths (tests pin the branch they
    # exercise rather than inheriting the host's), but a few things can only be
    # checked natively: the pywin32 mutex and ctypes.wintypes on Windows, and
    # the Air locator / su builder on macOS. macos-14 is Apple Silicon, which
    # is the only architecture BlueStacks Air runs on.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # PyQt5 needs a display; the runners have none. Windows is fine headless,
      # macOS needs Qt told so explicitly or every widget test aborts.
      - name: Run tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
